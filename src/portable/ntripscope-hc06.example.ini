; Native Bluetooth on macOS; use --ask-password if authentication is required.
; Pair exactly one HC-06 before connecting. No [rover] coordinates:
; valid GGA from the receiver supplies the position to the caster.
[caster]
host = caster.example.org
port = 2101
mountpoint = VRS
username = demo
version = 2
tls = false

[outputs]
serial = /dev/cu.HC-06:115200
; Optional simultaneous outputs:
; file = corrections.rtcm
; tcp = 5000
; stdout = true
