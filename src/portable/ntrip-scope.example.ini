[caster]
host = caster.example.org
port = 2101
mountpoint = EXAMPLE
version = 2
tls = false
; username = your-user
; password = your-password
; list = true

; Uncomment the rover section and both coordinates for a VRS stream.
; [rover]
; latitude = 46.125000
; longitude = 13.333333
; height = 100.000
; geoid = 0.000

; Optional outputs. One destination per line, indent additional values.
; With no destinations configured, raw RTCM goes to stdout.
; [outputs]
; stdout = true
; file = corrections.rtcm
;     second-copy.rtcm
; tcp = 5000
;     5001
; serial = COM3:115200
