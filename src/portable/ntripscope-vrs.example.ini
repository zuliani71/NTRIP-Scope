; Replace the example caster, mountpoint and rover coordinates.
; If authentication is needed, run with --ask-password or set password below.
[caster]
host = caster.example.org
port = 2101
mountpoint = VRS
username = demo
; password = your-password
version = 2
tls = false

[rover]
latitude = 46.125000
longitude = 13.333333
height = 100.000
geoid = 0.000

[outputs]
stdout = true
file = corrections.rtcm
    second-copy.rtcm
tcp = 5000
; Uncomment a serial device if needed.
; serial = /dev/ttyUSB0:115200
; On Windows, use COM3:115200 instead.
